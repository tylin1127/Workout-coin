        <section class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg space-y-4">

        <section class="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-4 shadow-lg space-y-3">

            <div class="flex space-x-2">
                <input id="import-code-input" type="text" placeholder="\u5728\u6b64\u8cbc\u4e0a\u5099\u4efd\u4ee3\u78bc..." class="w-2/3 bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-sky-500">

        <footer class="text-center pt-2">

        </footer>
        `;

        const STORAGE_KEY = 'vibe_workout_game_v1';

        function getTodayStr() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getYesterdayStr() {
            const d = new Date();
            d.setDate(d.getDate() - 1);
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        const defaultRewards = [
            { id: 1, name: '\ud83e\udd64 \u4eab\u53d7\u4e00\u676f\u624b\u6416\u98f2\u6216\u9ede\u5fc3', cost: 150 },
            { id: 2, name: '\ud83c\udfae \u81ea\u7531\u6253\u96fb\u52d5 / \u653e\u9b06 2 \u5c0f\u6642', cost: 350 },
            { id: 3, name: '\ud83d\udd25 \u5165\u624b\u559c\u6b61\u7684\u5361\u724c\u6216\u6536\u85cf\u5468\u908a', cost: 1000 }
        ];

        const defaultData = {
            coins: 0,
            streak: 0,
            workoutSessions: 0,
            lastHabitDate: null,
            lastCompletedDate: null,
            todayDate: getTodayStr(),
            todayCount: 0,
            dailyBonusClaimed: false,
            calmParentingClaimed: false,
            waterGoalClaimed: false,
            noSnackClaimed: false,
            earlySleepClaimed: false,
            rewards: JSON.parse(JSON.stringify(defaultRewards)),
            history: []
        };

        let gameState = loadData();
        let plankInterval = null;
        let plankTotalSeconds = 30;
        let plankRemainingSeconds = 30;
        let plankRewardCoins = 15;
        let plankPaused = false;
        let audioCtx = null;

        function checkDayRollover() {
            const today = getTodayStr();
            if (gameState.todayDate !== today) {
                gameState.todayDate = today;
                gameState.todayCount = 0;
                gameState.dailyBonusClaimed = false;
                gameState.calmParentingClaimed = false;
                gameState.waterGoalClaimed = false;
                gameState.noSnackClaimed = false;
                gameState.earlySleepClaimed = false;
                saveData();

        function playBeep(freq = 600, duration = 0.12, type = 'sine') {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function startPlankTimer(seconds, reward) {
            checkDayRollover();
            if (plankInterval) clearInterval(plankInterval);
            plankTotalSeconds = seconds;
            plankRemainingSeconds = seconds;
            plankRewardCoins = reward;
            plankPaused = false;

            document.getElementById('plank-select-controls').classList.add('hidden');
            document.getElementById('plank-timer-active').classList.remove('hidden');
            document.getElementById('plank-pause-btn').innerText = '\u66ab\u505c';
            document.getElementById('plank-target-label').innerText = `\ud83d\udd25 \u68d2\u5f0f ${seconds} \u79d2\u6311\u6230\u9032\u884c\u4e2d...`;

            playBeep(523.25, 0.15);
            updatePlankTimerUI();

            plankInterval = setInterval(() => {
                if (plankPaused) return;
                plankRemainingSeconds -= 1;
                updatePlankTimerUI();

                if (plankRemainingSeconds > 0 && plankRemainingSeconds <= 3) {
                    playBeep(659.25, 0.12);
                }

                if (plankRemainingSeconds <= 0) {
                    clearInterval(plankInterval);
                    plankInterval = null;
                    playBeep(783.99, 0.15);
                    setTimeout(() => playBeep(1046.5, 0.4, 'triangle'), 160);
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);

                    document.getElementById('plank-timer-active').classList.add('hidden');
                    document.getElementById('plank-select-controls').classList.remove('hidden');
                    doExercise(`\u68d2\u5f0f\u6490\u9ad4 (${plankTotalSeconds}\u79d2\u6311\u6230)`, plankRewardCoins, 1);
                }
            }, 1000);
        }

        function updatePlankTimerUI() {
            const mins = String(Math.floor(plankRemainingSeconds / 60)).padStart(2, '0');
            const secs = String(plankRemainingSeconds % 60).padStart(2, '0');
            document.getElementById('plank-countdown-text').innerText = `${mins}:${secs}`;
            const percent = Math.max(0, (plankRemainingSeconds / plankTotalSeconds) * 100);
            document.getElementById('plank-timer-bar').style.width = `${percent}%`;
        }

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) return JSON.parse(JSON.stringify(defaultData));
            let data = JSON.parse(saved);
            if (typeof data.calmParentingClaimed === 'undefined') data.calmParentingClaimed = false;
            if (typeof data.waterGoalClaimed === 'undefined') data.waterGoalClaimed = false;
            if (typeof data.noSnackClaimed === 'undefined') data.noSnackClaimed = false;
            if (typeof data.earlySleepClaimed === 'undefined') data.earlySleepClaimed = false;
            if (typeof data.workoutSessions === 'undefined') data.workoutSessions = data.streak || 0;
            if (typeof data.lastHabitDate === 'undefined') data.lastHabitDate = null;

            if (data.rewards && data.rewards.length >= 3) {
                data.rewards.forEach(r => {
                    if (r.id === 1) r.name = defaultRewards[0].name;
                    if (r.id === 2) r.name = defaultRewards[1].name;
                    if (r.id === 3) r.name = defaultRewards[2].name;
                });
            }

            const today = getTodayStr();
            const legacyToday = new Date().toLocaleDateString();
            if (data.todayDate !== today && data.todayDate !== legacyToday) {
                data.todayDate = today;
                data.todayCount = 0;
                data.dailyBonusClaimed = false;
                data.calmParentingClaimed = false;
                data.waterGoalClaimed = false;
                data.noSnackClaimed = false;
                data.earlySleepClaimed = false;
            } else {
                data.todayDate = today;
                if ((data.calmParentingClaimed || data.waterGoalClaimed || data.noSnackClaimed || data.earlySleepClaimed || data.dailyBonusClaimed) && data.lastHabitDate !== today) {
                    data.streak = (data.streak || 0) + 1;
                    data.lastHabitDate = today;
                }
            }
            return data;
        }

        function importSaveCode() {
            const input = document.getElementById('import-code-input');

                alert('\u8acb\u5148\u5728\u8f38\u5165\u6846\u8cbc\u4e0a\u5099\u4efd\u4ee3\u78bc\uff01');
                return;

            try {
                const jsonStr = decodeURIComponent(atob(code));
                const importedData = JSON.parse(jsonStr);
                if (typeof importedData.coins !== 'number' || !Array.isArray(importedData.rewards)) {
                    throw new Error('Invalid format');
                }
                if (typeof importedData.calmParentingClaimed === 'undefined') importedData.calmParentingClaimed = false;
                if (typeof importedData.waterGoalClaimed === 'undefined') importedData.waterGoalClaimed = false;
                if (typeof importedData.workoutSessions === 'undefined') importedData.workoutSessions = importedData.streak || 0;
                gameState = importedData;

                alert(`\ud83c\udf89 \u5b58\u6a94\u9084\u539f\u6210\u529f\uff01\u76ee\u524d\u6301\u6709 ${gameState.coins} \u91d1\u5e63\u3002`);

        function doExercise(name, coinReward, setsAdded = 1) {
            checkDayRollover();
            gameState.coins += coinReward;
            gameState.todayCount += setsAdded;
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const setLabel = setsAdded >= 3 ? '\u5b8c\u6210\u9577\u6642\u9593\u904b\u52d5' : '\u5b8c\u6210 1 \u7d44';
            gameState.history.unshift(`\u2705 [${timeStr}] ${setLabel}\u3010${name}\u3011\uff0c\u7372\u5f97 +${coinReward} \ud83e\ude99`);
            if (gameState.history.length > 30) gameState.history.pop();

            if (gameState.todayCount >= 3 && !gameState.dailyBonusClaimed) {
                claimDailyBonus();
                return;
            }

            confetti({ particleCount: setsAdded >= 3 ? 65 : 30, spread: 60, origin: { y: 0.7 } });
            saveData();
        }

        function claimDailyBonus() {
            checkDayRollover();
            if (gameState.todayCount < 3 || gameState.dailyBonusClaimed) return;
            const bonus = 35;
            gameState.coins += bonus;
            gameState.dailyBonusClaimed = true;

            const today = getTodayStr();
            if (gameState.lastCompletedDate !== today) {
                gameState.workoutSessions = (gameState.workoutSessions || 0) + 1;
                gameState.lastCompletedDate = today;
            }
            markDailyHabitActive();

            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            gameState.history.unshift(`\ud83c\udf89 [${timeStr}] \u5b8c\u6210\u5169\u65e5\u4e00\u7df4\u76ee\u6a19\uff01\u7372\u5f97\u5b8c\u8cfd\u734e\u52f5 +${bonus} \ud83e\ude99\uff08\u7d2f\u8a08 ${gameState.workoutSessions} \u6b21\u9054\u6a19\uff09`);
            if (gameState.history.length > 30) gameState.history.pop();

            saveData();
        }

            checkDayRollover();
            const reward = gameState.rewards.find(r => r.id === id);
            if (!reward) return;
            if (gameState.coins < reward.cost) {
                alert('\u91d1\u5e63\u4e0d\u8db3\u5594\uff01\u7e7c\u7e8c\u4fdd\u6301\u6eab\u548c\u80b2\u5152\u8207\u904b\u52d5\u5427 \ud83d\udcaa');
                return;
            }
            if (confirm(`\u78ba\u5b9a\u8981\u82b1\u8cbb ${reward.cost} \u91d1\u5e63\u514c\u63db\u300c${reward.name}\u300d\u55ce\uff1f`)) {

                        </div>
                    </div>
                    <span class="text-xs text-emerald-400 font-bold px-2 py-1">\u5df2\u9054\u6210</span>
                `;
            } else {
                calmParentingBtn.disabled = false;
                calmParentingBtn.className = "btn-active w-full flex items-center justify-between bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/50 p-3.5 rounded-xl transition cursor-pointer";
                calmParentingBtn.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="text-2xl bg-amber-950/80 p-2 rounded-lg">\ud83e\uddd8</span>
                        <div class="text-left">
                            <div class="font-bold text-amber-200">\u4eca\u65e5\u80b2\u5152\u60c5\u7dd2\u7a69\u5b9a\uff08\u672a\u5931\u63a7\uff09</div>
                            <div class="text-xs text-amber-300/80">\u6eab\u548c\u5805\u5b9a\u3001\u4e0d\u66b4\u8d70\u7684\u9ad8\u96e3\u5ea6\u4fee\u7149\u5927\u734e</div>
                        </div>
                    </div>
                    <span class="bg-amber-400 text-slate-950 font-extrabold px-3 py-1 rounded-lg text-sm shadow">+100 \ud83e\ude99</span>
                `;
            }

            const waterGoalBtn = document.getElementById('water-goal-btn');
            if (gameState.waterGoalClaimed) {
                waterGoalBtn.disabled = true;
                waterGoalBtn.className = "w-full flex items-center justify-between bg-emerald-950/40 border border-emerald-700/40 p-3.5 rounded-xl cursor-default";
                waterGoalBtn.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="text-2xl bg-emerald-900/50 p-2 rounded-lg">\u2705</span>
                        <div class="text-left">
                            <div class="font-bold text-emerald-400">2500ml \u98f2\u6c34\u76ee\u6a19\u5df2\u9054\u6210\uff01</div>
                            <div class="text-xs text-slate-400">\u5df2\u9818\u53d6 +30 \u91d1\u5e63\uff0c\u8eab\u9ad4\u4ee3\u8b1d\u6eff\u5206</div>
                        </div>
                    </div>
                    <span class="text-xs text-emerald-400 font-bold px-2 py-1">\u5df2\u9054\u6210</span>
                `;
            } else {
                waterGoalBtn.disabled = false;
                waterGoalBtn.className = "btn-active w-full flex items-center justify-between bg-sky-600/30 hover:bg-sky-600/40 border border-sky-500/50 p-3.5 rounded-xl transition cursor-pointer";
                waterGoalBtn.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="text-2xl bg-sky-950 p-2 rounded-lg">\ud83d\udca7</span>
                        <div class="text-left">
                            <div class="font-bold text-white">\u4eca\u65e5\u559d\u6c34\u8d85\u904e 2500ml\uff01</div>
                            <div class="text-xs text-sky-300">\u8db3\u91cf\u88dc\u6c34\u7684\u65b0\u9673\u4ee3\u8b1d\u734e\u52f5</div>
                        </div>
                    </div>
                    <span class="bg-amber-500/20 text-amber-300 border border-amber-500/30 font-bold px-3 py-1 rounded-lg text-sm">+30 \ud83e\ude99</span>
                `;
            }

            const noSnackBtn = document.getElementById('no-snack-btn');
            if (gameState.noSnackClaimed) {
                noSnackBtn.disabled = true;
                noSnackBtn.className = "w-full flex items-center justify-between bg-emerald-950/40 border border-emerald-700/40 p-3.5 rounded-xl cursor-default";
                noSnackBtn.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="text-2xl bg-emerald-900/50 p-2 rounded-lg">\u2705</span>
                        <div class="text-left">
                            <div class="font-bold text-emerald-400">\u4eca\u65e5\u5bb5\u591c\u9632\u7dda\u5df2\u5b88\u4f4f\uff01</div>
                            <div class="text-xs text-slate-400">\u5df2\u9818\u53d6 +30 \u91d1\u5e63\uff0c\u660e\u5929\u7e7c\u7e8c\u4fdd\u6301</div>
                        </div>
                    </div>
                    <span class="text-xs text-emerald-400 font-bold px-2 py-1">\u5df2\u9054\u6210</span>
                `;
            } else {
                noSnackBtn.disabled = false;
                noSnackBtn.className = "btn-active w-full flex items-center justify-between bg-indigo-600/30 hover:bg-indigo-600/40 border border-indigo-500/50 p-3.5 rounded-xl transition cursor-pointer";
                noSnackBtn.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="text-2xl bg-indigo-950 p-2 rounded-lg">\ud83d\udee1\ufe0f</span>
                        <div class="text-left">
                            <div class="font-bold text-white">\u4eca\u65e5\u6210\u529f\u4e0d\u5403\u5bb5\u591c\uff01</div>
                            <div class="text-xs text-indigo-300">\u6230\u52dd\u5634\u995e\u7684\u610f\u5fd7\u529b\u734e\u52f5</div>
                        </div>
                    </div>
                    <span class="bg-amber-500/20 text-amber-300 border border-amber-500/30 font-bold px-3 py-1 rounded-lg text-sm">+30 \ud83e\ude99</span>
                `;
            }

            const earlySleepBtn = document.getElementById('early-sleep-btn');
            if (gameState.earlySleepClaimed) {
                earlySleepBtn.disabled = true;
                earlySleepBtn.className = "w-full flex items-center justify-between bg-emerald-950/40 border border-emerald-700/40 p-3.5 rounded-xl cursor-default";
                earlySleepBtn.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="text-2xl bg-emerald-900/50 p-2 rounded-lg">\u2705</span>
                        <div class="text-left">
                            <div class="font-bold text-emerald-400">12:15 \u6e96\u6642\u7761\u89ba\u5df2\u9054\u6210\uff01</div>
                            <div class="text-xs text-slate-400">\u5df2\u9818\u53d6 +30 \u91d1\u5e63\uff0c\u795d\u6709\u500b\u597d\u5922</div>
                        </div>
                    </div>
                    <span class="text-xs text-emerald-400 font-bold px-2 py-1">\u5df2\u9054\u6210</span>
                `;
            } else {
                earlySleepBtn.disabled = false;
                earlySleepBtn.className = "btn-active w-full flex items-center justify-between bg-indigo-600/30 hover:bg-indigo-600/40 border border-indigo-500/50 p-3.5 rounded-xl transition cursor-pointer";
                earlySleepBtn.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="text-2xl bg-indigo-950 p-2 rounded-lg">\ud83d\udecc</span>
                        <div class="text-left">
                            <div class="font-bold text-white">\u6e96\u6642\u65bc 12:15 \u524d\u7761\u89ba\uff01</div>
                            <div class="text-xs text-indigo-300">\u4e0d\u71ac\u591c\u7684\u9ad4\u529b\u8207\u4ee3\u8b1d\u52a0\u6210\u734e\u52f5</div>
                        </div>
                    </div>
                    <span class="bg-amber-500/20 text-amber-300 border border-amber-500/30 font-bold px-3 py-1 rounded-lg text-sm">+30 \ud83e\ude99</span>
                `;
            }

            const rewardList = document.getElementById('reward-list');
            rewardList.innerHTML = '';
            gameState.rewards.forEach(reward => {
                const canAfford = gameState.coins >= reward.cost;
                const item = document.createElement('div');
                item.className = "flex items-center justify-between bg-slate-700/40 border border-slate-700 p-3 rounded-xl";
                item.innerHTML = `
                    <div class="pr-2">
                        <div class="font-medium text-sm text-slate-100">${reward.name}</div>
                        <div class="text-xs text-amber-400 font-bold mt-0.5">${reward.cost} \ud83e\ude99</div>
                    </div>
                    <div class="flex items-center space-x-1.5 shrink-0">
                        <button onclick="redeemReward(${reward.id})" class="px-3 py-1.5 rounded-lg text-xs font-bold transition ${canAfford ? 'bg-amber-400 hover:bg-amber-300 text-slate-950 shadow' : 'bg-slate-700 text-slate-500 cursor-not-allowed'}">
                            \u514c\u63db
                        </button>
                        <button onclick="deleteReward(${reward.id})" class="text-slate-400 hover:text-red-400 p-1.5 rounded-lg hover:bg-slate-700 transition" aria-label="Delete">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                `;
                rewardList.appendChild(item);
            });

            const historyList = document.getElementById('history-list');
            if (gameState.history.length === 0) {
                historyList.innerHTML = '<li class="text-slate-500 italic">\u5c1a\u7121\u7d00\u9304\uff0c\u9ede\u64ca\u4e0a\u65b9\u6309\u9215\u958b\u59cb\u7b2c\u4e00\u7d44\u4efb\u52d5\u5427\uff01</li>';
            } else {
                historyList.innerHTML = gameState.history.map(item => `<li class="border-b border-slate-700/50 pb-1.5">${item}</li>`).join('');
            }
        }

        renderUI();
    </script>
</body>
</html>
